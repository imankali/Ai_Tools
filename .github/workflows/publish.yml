# ---------------------------------------------------------------------------
# Release universal-agent-hub: build sdist+wheel, attach to a GitHub release
# and (optionally) publish to PyPI with trusted publishing (OIDC).
#
#   git tag v1.0.0 && git push origin v1.0.0
# ---------------------------------------------------------------------------
name: Publish

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read


jobs:
  build:
    name: build sdist + wheel
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: universal-agent-hub
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build tooling
        run: python -m pip install --upgrade pip build twine

      - name: Check the version matches the tag
        run: |
          python - <<'PY'
          import os, pathlib, tomllib

          version = tomllib.loads(pathlib.Path("pyproject.toml").read_text(encoding="utf-8"))["project"]["version"]
          tag = os.environ.get("GITHUB_REF_NAME", "")
          if tag.startswith("v") and tag[1:] != version:
              raise SystemExit(f"tag {tag} does not match pyproject version {version}")
          print(f"ok: version {version}")
          PY

      - name: Build distributions
        run: python -m build --outdir dist

      - name: twine check
        run: python -m twine check dist/*

      - name: Upload artifacts to the workflow run
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: universal-agent-hub/dist/*

      - name: Attach to the GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: universal-agent-hub/dist/*
          generate_release_notes: true

  pypi:
    name: publish to PyPI
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/universal-agent-hub
    permissions:
      id-token: write # trusted publishing (no API token secret needed)
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
          verbose: true

  # ------------------------------------------------------------------
  # Desktop bundles — یک باینلی برای هر سیستم‌عامل، پیوست‌شده به همان Release
  # ------------------------------------------------------------------
  bundles:
    name: desktop bundle (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: build
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: windows-x64
            archive: zip
          - os: macos-latest
            label: macos-arm64
            archive: tar
          - os: macos-13
            label: macos-intel
            archive: tar
          - os: ubuntu-latest
            label: linux-x64
            archive: tar
    defaults:
      run:
        working-directory: universal-agent-hub
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install the package + PyInstaller
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[system,search]" pyinstaller

      - name: Build the bundle
        shell: bash
        run: python -m PyInstaller packaging/agent-hub.spec --noconfirm --distpath dist/${{ matrix.label }}

      - name: Archive
        shell: bash
        run: |
          VERSION=$(python -c "import tomllib,pathlib;print(tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version'])")
          NAME=agent-hub-${VERSION}-${{ matrix.label }}
          if [ "${{ matrix.archive }}" = "zip" ]; then
            (cd dist/${{ matrix.label }} && zip -qr ../../${NAME}.zip agent-hub)
          else
            tar -czf ${NAME}.tar.gz -C dist/${{ matrix.label }} agent-hub
          fi
          echo "ARTIFACT=${NAME}" >> "$GITHUB_ENV"

      - name: Smoke-test the binary
        shell: bash
        run: |
          ./dist/${{ matrix.label }}/agent-hub/agent-hub* --version
          ./dist/${{ matrix.label }}/agent-hub/agent-hub* --serve --help >/dev/null || true

      - name: Upload to the workflow run
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT }}
          path: universal-agent-hub/${{ env.ARTIFACT }}.*

      - name: Attach to the GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: universal-agent-hub/${{ env.ARTIFACT }}.*
          append_body: true

  # ------------------------------------------------------------------
  # Android — APK امضاشده با debug key (بدون Play Store)
  # ------------------------------------------------------------------
  android:
    name: android apk
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write
    defaults:
      run:
        working-directory: universal-agent-hub/apps/android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.7"

      - name: Build the debug APK
        run: gradle :app:assembleDebug --console=plain --no-daemon

      - name: Collect the APK at the workspace root
        run: cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/agent-hub-android-debug.apk"

      - name: Upload to the workflow run
        uses: actions/upload-artifact@v4
        with:
          name: agent-hub-android-debug
          path: agent-hub-android-debug.apk

      - name: Attach to the GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: agent-hub-android-debug.apk
          append_body: true

  # ------------------------------------------------------------------
  # iOS — فقط بررسی کامپایل (ساخته‌ی امضاشده نیازمند Xcode + Apple ID است)
  # ------------------------------------------------------------------
  ios:
    name: ios build check
    runs-on: macos-latest
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    defaults:
      run:
        working-directory: universal-agent-hub/apps/ios
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate the project
        run: xcodegen generate

      - name: Build for the simulator (unsigned)
        run: |
          xcodebuild -project UniversalAgentHub.xcodeproj -scheme UniversalAgentHub \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build
