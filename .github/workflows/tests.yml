# ---------------------------------------------------------------------------
# Test suite for universal-agent-hub (pytest + coverage gate)
#
# The project lives in the `universal-agent-hub/` sub-directory of this repo,
# so every step runs with that as the working directory.
# ---------------------------------------------------------------------------
name: Tests

on:
  push:
    branches: [main]
    paths:
      - "universal-agent-hub/**"
      - ".github/workflows/tests.yml"
  pull_request:
    paths:
      - "universal-agent-hub/**"
      - ".github/workflows/tests.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

# Tests never call a real API: the agent loop uses a fake client and the search
# tools fall back to the offline backend, so a placeholder key is enough.
env:
  OPENAI_API_KEY: sk-test-key-not-real-000000
  MODEL_NAME: gpt-6-astra

jobs:
  pytest:
    name: pytest · ${{ matrix.os }} · py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.11", "3.12"]
        exclude:
          # one full matrix on ubuntu, a smoke subset elsewhere
          - os: macos-latest
            python: "3.11"
          - os: windows-latest
            python: "3.11"
    defaults:
      run:
        working-directory: universal-agent-hub
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            universal-agent-hub/requirements.txt
            universal-agent-hub/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt
          python -m pip install -e .

      - name: Run tests (coverage gate: 80%)
        env:
          PYTEST_ADDOPTS: "-m 'not network'"
        run: python -m pytest -q --cov=src --cov-report=xml --cov-report=term-missing --cov-fail-under=80

      - name: Upload coverage report
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.11'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: universal-agent-hub/coverage.xml
          retention-days: 14

  integration:
    name: integration · real filesystem and processes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: universal-agent-hub
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: universal-agent-hub/requirements-dev.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Run only the tests that touch real processes/files
        run: python -m pytest -q -m integration --no-cov -p no:cacheprovider
